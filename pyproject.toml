[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docx2md-visio"
version = "0.3.0"
description = "Deterministically convert DOCX files with embedded Visio diagrams to Markdown and Mermaid."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "docx2md-visio contributors" }]
keywords = ["docx", "visio", "markdown", "mermaid", "pandoc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.scripts]
docx2md-visio = "docx2md_visio.cli:main"
docx2md-visio-apply = "docx2md_visio.apply_review:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
